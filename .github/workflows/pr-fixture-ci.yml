name: PR Fixture CI Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-gate:
    name: Offline Fixture CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      FOCUSLIST_PROVIDER: fixture
      FOCUSLIST_DB_PATH: ${{ runner.temp }}/ci_focuslist.db
      FOCUSLIST_AUTH_STORE_DIR: ${{ runner.temp }}/ci_auth
      FOCUSLIST_OAUTH_CLIENT_FILE: ""
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov mypy

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check with mypy
        run: python -m mypy --ignore-missing-imports src/focuslist

      - name: Run offline unit, integration, and MCP stdio tests with coverage
        run: python -m pytest -v --cov=focuslist --cov-report=term-missing

      - name: Run compliance gate and SK-1 local-check
        run: python -m focuslist.platform.compliance
